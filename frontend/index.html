<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVOnto 护士站 - 门诊分诊系统</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-light: #3385d6;
            --primary-dark: #0052a3;
            --accent-color: #00a8a8;
            --success-color: #52c41a;
            --warning-color: #faad14;
            --error-color: #f5222d;
            --text-primary: #262626;
            --text-secondary: #595959;
            --text-tertiary: #8c8c8c;
            --border-color: #e8e8e8;
            --bg-color: #f5f7fa;
            --card-shadow: 0 2px 8px rgba(0,0,0,0.06);
            --card-shadow-hover: 0 4px 16px rgba(0,0,0,0.12);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; 
            background: var(--bg-color); 
            color: var(--text-primary); 
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ============ 登录页面 ============ */
        .login-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0066cc 0%, #00a8a8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .login-container {
            width: 420px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .login-header {
            background: linear-gradient(135deg, #0066cc 0%, #00a8a8 100%);
            padding: 40px 40px 30px;
            text-align: center;
            color: #fff;
        }
        
        .login-logo {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 16px;
        }
        
        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .login-header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .login-body {
            padding: 32px 40px 40px;
        }
        
        .login-form-group {
            margin-bottom: 24px;
        }
        
        .login-form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .login-form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s;
        }
        
        .login-form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0066cc 0%, #00a8a8 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,102,204,0.3);
        }
        
        .login-error {
            background: #fff1f0;
            border: 1px solid #ffa39e;
            color: var(--error-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        
        /* ============ 主页面 ============ */
        .main-page {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        
        .main-page.active {
            display: flex;
        }
        
        /* 顶部导航 */
        .header {
            background: linear-gradient(135deg, #0066cc 0%, #00a8a8 100%);
            color: #fff;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header-logo {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        .header-title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header-nav {
            display: flex;
            gap: 8px;
        }
        
        .nav-item {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .nav-item:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        
        .nav-item.active {
            background: rgba(255,255,255,0.25);
            color: #fff;
            font-weight: 500;
        }
        
        .header-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .current-time {
            font-size: 13px;
            opacity: 0.9;
        }
        
        .btn-logout {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-logout:hover {
            background: rgba(255,255,255,0.25);
        }
        
        /* 主容器 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        /* 左侧边栏 */
        .sidebar {
            width: 340px;
            background: #fff;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-section {
            border-bottom: 1px solid var(--border-color);
        }
        
        .section-header {
            padding: 14px 16px;
            background: #fafbfc;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }
        
        .section-content {
            padding: 12px;
            overflow-y: auto;
        }
        
        /* 科室筛选 */
        .dept-filter {
            padding: 16px;
            background: #fafbfc;
        }
        
        .dept-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .dept-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        /* 医生列表 */
        .doctor-list {
            max-height: 280px;
        }

        .time-filter-tabs {
            display: flex;
            gap: 8px;
            padding: 10px 12px 0;
            background: #fafbfc;
        }

        .time-filter-tab {
            flex: 1;
            padding: 7px 8px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 13px;
        }

        .time-filter-tab.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #fff;
        }
        
        .doctor-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
            border: 1px solid transparent;
        }
        
        .doctor-item:hover {
            background: #f0f7ff;
            border-color: #bae0ff;
        }
        
        .doctor-item.active {
            background: linear-gradient(135deg, #e6f4ff 0%, #f0f9ff 100%);
            border-color: var(--primary-color);
        }
        
        .doctor-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            margin-right: 12px;
        }
        
        .doctor-info {
            flex: 1;
        }
        
        .doctor-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        
        .doctor-meta {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        
        .doctor-count {
            background: var(--error-color);
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        
        /* 患者列表 */
        .patient-list {
            flex: 1;
        }
        
        .patient-item {
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            background: #fff;
        }
        
        .patient-item:hover {
            border-color: #bae0ff;
            box-shadow: var(--card-shadow);
        }
        
        .patient-item.active {
            border-color: var(--primary-color);
            background: linear-gradient(135deg, #e6f4ff 0%, #f0f9ff 100%);
        }
        
        .patient-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .patient-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .patient-serial {
            background: var(--primary-color);
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .patient-info {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        .patient-status {
            margin-top: 8px;
            font-size: 12px;
        }
        
        .status-reported {
            color: var(--success-color);
        }
        
        .status-pending {
            color: var(--warning-color);
        }
        
        /* 右侧内容区 */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 16px;
            gap: 16px;
        }
        
        /* 患者详情卡片 */
        .patient-detail-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            padding: 20px 24px;
            display: none;
        }
        
        .patient-detail-card.show {
            display: block;
        }
        
        .detail-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .detail-name {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .detail-tags {
            display: flex;
            gap: 8px;
        }
        
        .detail-tag {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
        }
        
        .tag-visit {
            background: #e6f4ff;
            color: var(--primary-color);
        }
        
        .tag-serial {
            background: #f6ffed;
            color: var(--success-color);
        }
        
        .detail-info-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        
        .detail-info-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-info-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }
        
        .detail-info-value {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        /* 开单信息 */
        .orders-container {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .orders-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafbfc;
        }
        
        .orders-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .btn-refresh {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-refresh:hover {
            background: var(--primary-light);
        }
        
        .orders-content {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
        }
        
        .order-group {
            margin-bottom: 20px;
        }
        
        .order-group-header {
            padding: 12px 16px;
            background: linear-gradient(135deg, #f0f7ff 0%, #e6f4ff 100%);
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .order-group-count {
            background: var(--primary-color);
            color: #fff;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .order-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .order-table th {
            background: #fafbfc;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        
        .order-table td {
            padding: 12px 16px;
            color: var(--text-secondary);
            border-bottom: 1px solid #f0f0f0;
        }
        
        .order-table tr:hover {
            background: #f6ffed;
        }
        
        .cmc-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: #fff2e8;
            color: #fa541c;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-tertiary);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 14px;
        }
        
        /* API状态提示 */
        .api-status {
            position: fixed;
            top: 80px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 100;
            display: none;
            box-shadow: var(--card-shadow-hover);
        }
        
        .api-status.success {
            background: #f6ffed;
            color: var(--success-color);
            border: 1px solid #b7eb8f;
            display: block;
        }
        
        .api-status.error {
            background: #fff1f0;
            color: var(--error-color);
            border: 1px solid #ffa39e;
            display: block;
        }
        
        /* 耗材提醒 */
        .cmc-alert {
            background: #fff2e8;
            border: 1px solid #ffbb96;
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #873800;
        }
        
        .hidden {
            display: none !important;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-page">
        <div class="login-container">
            <div class="login-header">
                <div class="login-logo">🏥</div>
                <h1>CVOnto 护士站</h1>
                <p>门诊分诊管理系统</p>
            </div>
            <div class="login-body">
                <div class="login-error" id="loginError"></div>
                <form id="loginForm">
                    <div class="login-form-group">
                        <label>护士工号</label>
                        <input type="text" id="nurseCode" placeholder="请输入工号" autocomplete="username">
                    </div>
                    <div class="login-form-group">
                        <label>登录密码</label>
                        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
                    </div>
                    <button type="submit" class="login-btn">登 录</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="mainPage" class="main-page">
        <!-- 顶部导航 -->
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">🏥</div>
                <div class="header-title">CVOnto 护士站</div>
            </div>
            
            <nav class="header-nav">
                <a href="index.html" class="nav-item active">
                    <span>📋</span>
                    <span>工作台</span>
                </a>
                <a href="patient_query.html" class="nav-item">
                    <span>🔍</span>
                    <span>患者查询</span>
                </a>
                <a href="nurse_admin.html" class="nav-item" id="adminNavItem" style="display: none;">
                    <span>⚙️</span>
                    <span>权限管理</span>
                </a>
            </nav>
            
            <div class="header-user">
                <div class="user-info">
                    <span>👤</span>
                    <span id="nurseName">--</span>
                </div>
                <span class="current-time" id="currentTime">--</span>
                <button class="btn-logout" onclick="doLogout()">
                    <span>🚪</span>
                    <span>退出</span>
                </button>
            </div>
        </header>
        
        <!-- 主容器 -->
        <div class="main-container">
            <!-- 左侧边栏 -->
            <aside class="sidebar">
                <!-- 科室筛选 -->
                <div class="sidebar-section">
                    <div class="dept-filter">
                        <select class="dept-select" id="deptSelect">
                            <option value="">全部科室</option>
                        </select>
                    </div>
                </div>
                
                <!-- 出诊医生 -->
                <div class="sidebar-section" style="flex: 0 0 auto;">
                    <div class="section-header">
                        <span>👨‍⚕️ 出诊医生（号别排班）</span>
                        <button class="btn-refresh" onclick="refreshSchedules()" style="padding: 4px 10px; font-size: 12px;">🔄</button>
                    </div>
                    <div class="time-filter-tabs" id="timeFilterTabs">
                        <button class="time-filter-tab active" type="button" data-time-desc="" onclick="selectTimeFilter('')">全部</button>
                        <button class="time-filter-tab" type="button" data-time-desc="上午" onclick="selectTimeFilter('上午')">上午</button>
                        <button class="time-filter-tab" type="button" data-time-desc="下午" onclick="selectTimeFilter('下午')">下午</button>
                    </div>
                    <div class="section-content doctor-list" id="doctorList">
                        <div class="empty-state">
                            <div class="empty-state-icon">👨‍⚕️</div>
                            <div class="empty-state-text">加载中...</div>
                        </div>
                    </div>
                </div>
                
                <!-- 患者列表 -->
                <div class="sidebar-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                    <div class="section-header">
                        <span>👥 患者列表 (<span id="patientCount">0</span>)</span>
                    </div>
                    <div class="section-content patient-list" id="patientList" style="flex: 1;">
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <div class="empty-state-text">请选择号别查看患者</div>
                        </div>
                    </div>
                </div>
            </aside>
            
            <!-- 右侧内容区 -->
            <main class="content">
                <!-- 耗材提醒 -->
                <div class="cmc-alert hidden" id="cmcAlert">
                    <span style="font-size: 18px;">📦</span>
                    <span>该患者有耗材医嘱需要扫码确认，请及时处理</span>
                </div>
                
                <!-- 患者详情 -->
                <div class="patient-detail-card" id="patientDetailCard">
                    <div class="detail-header">
                        <span class="detail-name" id="detailName">--</span>
                        <div class="detail-tags">
                            <span class="detail-tag tag-visit" id="detailVisitNo">--</span>
                            <span class="detail-tag tag-serial" id="detailSerial">--</span>
                        </div>
                    </div>
                    <div class="detail-info-grid" id="detailInfoGrid">
                        <!-- 动态填充 -->
                    </div>
                </div>
                
                <!-- 开单信息 -->
                <div class="orders-container">
                    <div class="orders-header">
                        <span class="orders-title">📋 开单信息（处方/检查/检验）</span>
                        <button class="btn-refresh" onclick="refreshOrders()">
                            <span>🔄</span>
                            <span>刷新</span>
                        </button>
                    </div>
                    <div class="orders-content" id="ordersContent">
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <div class="empty-state-text">请选择患者查看开单信息</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div class="api-status" id="apiStatus"></div>
    
    <script>
        // ============ 全局变量 ============
        // 使用同源 API，兼容通过内网 IP 或 hosts 域名访问页面的护士站终端。
        const API_BASE = '';
        let currentDept = '';
        let currentSchedule = null;
        let currentPatient = null;
        let schedulesData = [];
        let deptGroupsData = [];
        let currentTimeDesc = '';
        let patientsData = [];
        let nurseInfo = null;
        
        // ============ 初始化 ============
        document.addEventListener('DOMContentLoaded', init);
        
        async function init() {
            updateTime();
            setInterval(updateTime, 60000);
            
            // 绑定登录表单
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            
            // 检查登录状态
            const isLoggedIn = await checkLogin();
            if (isLoggedIn) {
                showMainPage();
            }
        }
        
        function updateTime() {
            const timeEl = document.getElementById('currentTime');
            if (timeEl) {
                timeEl.textContent = new Date().toLocaleString('zh-CN', { 
                    month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', weekday: 'long' 
                });
            }
        }
        
        // ============ 登录功能 ============
        async function handleLogin(e) {
            e.preventDefault();
            
            const nurseCode = document.getElementById('nurseCode').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('loginError');
            
            if (!nurseCode || !password) {
                showLoginError('请输入工号和密码');
                return;
            }
            
            try {
                const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nurse_code: nurseCode, password: password })
                });
                
                const result = await res.json();
                
                if (result.success) {
                    nurseInfo = result.data;
                    sessionStorage.setItem('nurseInfo', JSON.stringify(nurseInfo));
                    showMainPage();
                } else {
                    showLoginError(result.message || '登录失败');
                }
            } catch (e) {
                console.error('登录失败:', e);
                showLoginError('登录失败，请检查网络连接');
            }
        }
        
        function showLoginError(message) {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
        }
        
        async function checkLogin() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/auth/current`);
                const result = await res.json();
                
                if (result.success) {
                    nurseInfo = result.data;
                    sessionStorage.setItem('nurseInfo', JSON.stringify(nurseInfo));
                    return true;
                }
                return false;
            } catch (e) {
                console.error('检查登录状态失败:', e);
                return false;
            }
        }
        
        function showMainPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainPage').classList.add('active');
            
            // 更新用户信息
            document.getElementById('nurseName').textContent = nurseInfo.name;
            checkAdminPermission();
            
            // 加载数据
            loadClinicSchedules();
        }
        
        async function doLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            
            try {
                await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
            } catch (e) {
                console.error('退出请求失败:', e);
            }
            
            sessionStorage.removeItem('nurseInfo');
            location.reload();
        }
        
        // ============ 数据加载 ============
        async function loadClinicSchedules() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const res = await fetch(`${API_BASE}/api/v1/clinic-schedules?clinic_date=${today}`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success) {
                    schedulesData = result.data.schedules;
                    deptGroupsData = result.data.dept_groups || [];
                    renderDeptSelect(deptGroupsData);
                    renderDoctorList(deptGroupsData);
                } else if (res.status === 401) {
                    location.reload();
                } else {
                    showApiStatus('获取号别排班失败: ' + result.message, 'error');
                }
            } catch (e) {
                console.error('加载号别排班失败:', e);
                showApiStatus('加载号别排班失败', 'error');
            }
        }
        
        function renderDeptSelect(deptGroups) {
            const select = document.getElementById('deptSelect');
            let html = '<option value="">全部科室</option>';
            deptGroups.forEach(dept => {
                html += `<option value="${dept.dept_name}">${dept.dept_name}</option>`;
            });
            select.innerHTML = html;
        }
        
        function renderDoctorList(deptGroups) {
            const container = document.getElementById('doctorList');
            
            if (!deptGroups || deptGroups.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👨‍⚕️</div><div class="empty-state-text">暂无号别排班数据</div></div>';
                return;
            }
            
            let html = '';
            deptGroups.forEach(dept => {
                dept.schedules.forEach(schedule => {
                    const isActive = currentSchedule && 
                                   currentSchedule.clinic_label === schedule.clinic_label &&
                                   currentSchedule.time_desc === schedule.time_desc;
                    
                    html += `
                        <div class="doctor-item ${isActive ? 'active' : ''}" 
                             onclick="selectSchedule('${schedule.clinic_label}', '${schedule.time_desc}', '${schedule.dept_name}')">
                            <div class="doctor-avatar">${schedule.clinic_label[0]}</div>
                            <div class="doctor-info">
                                <div class="doctor-name">${schedule.clinic_label}</div>
                                <div class="doctor-meta">${schedule.time_desc} · 限号${schedule.registration_limits} · 已挂${schedule.registration_num}</div>
                            </div>
                            <span class="doctor-count">${schedule.registration_num}</span>
                        </div>
                    `;
                });
            });
            
            container.innerHTML = html;
        }
        
        function selectSchedule(clinicLabel, timeDesc, deptName) {
            currentSchedule = { clinic_label: clinicLabel, time_desc: timeDesc, dept_name: deptName };
            renderDoctorList(getVisibleDeptGroups());
            loadPatientRegistrations(clinicLabel, timeDesc);
        }
        
        function refreshSchedules() {
            loadClinicSchedules();
        }
        
        // ============ 患者列表 ============
        async function loadPatientRegistrations(clinicLabel, timeDesc) {
            try {
                const today = new Date().toISOString().split('T')[0];
                const res = await fetch(`${API_BASE}/api/v1/patient-registrations?visit_date=${today}&clinic_label=${encodeURIComponent(clinicLabel)}&visit_time_desc=${encodeURIComponent(timeDesc)}`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success) {
                    patientsData = result.data.registrations;
                    renderPatientList(patientsData);
                } else if (res.status === 401) {
                    location.reload();
                } else {
                    showApiStatus('获取患者列表失败: ' + result.message, 'error');
                }
            } catch (e) {
                console.error('加载患者列表失败:', e);
                showApiStatus('加载患者列表失败', 'error');
            }
        }
        
        function renderPatientList(patients) {
            const container = document.getElementById('patientList');
            document.getElementById('patientCount').textContent = patients.length;
            
            if (patients.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><div class="empty-state-text">暂无患者</div></div>';
                return;
            }
            
            container.innerHTML = patients.map(p => `
                <div class="patient-item ${currentPatient === p.visit_no ? 'active' : ''}" 
                     onclick="selectPatient('${p.visit_no}')">
                    <div class="patient-header">
                        <span class="patient-name">${p.name}</span>
                        <span class="patient-serial">${p.serial_no}</span>
                    </div>
                    <div class="patient-info">
                        <span>${p.sex}</span>
                        <span>${p.age}岁</span>
                        <span>卡号: ${p.card_id}</span>
                    </div>
                    <div class="patient-status">
                        ${p.fre_date 
                            ? `<span class="status-reported">✅ 已报到 ${formatFreDate(p.fre_date)}</span>` 
                            : '<span class="status-pending">⏳ 未报到</span>'}
                    </div>
                </div>
            `).join('');
        }
        
        function formatFreDate(freDate) {
            if (!freDate) return '';
            try {
                const dt = new Date(freDate);
                return dt.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return freDate;
            }
        }
        
        // ============ 患者详情与开单 ============
        async function selectPatient(visitNo) {
            currentPatient = visitNo;
            renderPatientList(patientsData);
            
            const patient = patientsData.find(p => p.visit_no === visitNo);
            if (patient) {
                renderPatientDetail(patient);
            }
            
            await loadPatientOrders(visitNo);
        }
        
        function renderPatientDetail(patient) {
            document.getElementById('detailName').textContent = patient.name;
            document.getElementById('detailVisitNo').textContent = `就诊号: ${patient.visit_no}`;
            document.getElementById('detailSerial').textContent = `序号: ${patient.serial_no}`;
            
            document.getElementById('detailInfoGrid').innerHTML = `
                <div class="detail-info-item">
                    <span class="detail-info-label">患者ID</span>
                    <span class="detail-info-value">${patient.patient_id}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">卡号</span>
                    <span class="detail-info-value">${patient.card_id}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">性别</span>
                    <span class="detail-info-value">${patient.sex}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">年龄</span>
                    <span class="detail-info-value">${patient.age}岁</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">费别</span>
                    <span class="detail-info-value">${patient.charge_type || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">就诊日期</span>
                    <span class="detail-info-value">${patient.visit_date}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">午别</span>
                    <span class="detail-info-value">${patient.visit_time_desc}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">号别</span>
                    <span class="detail-info-value">${patient.clinic_label}</span>
                </div>
                <div class="detail-info-item" style="grid-column: span 2;">
                    <span class="detail-info-label">报到时间</span>
                    <span class="detail-info-value" style="color: ${patient.fre_date ? 'var(--success-color)' : 'var(--warning-color)'};">
                        ${patient.fre_date ? formatFreDateTime(patient.fre_date) : '未报到'}
                    </span>
                </div>
            `;
            
            document.getElementById('patientDetailCard').classList.add('show');
        }
        
        function formatFreDateTime(freDate) {
            if (!freDate) return '';
            try {
                const dt = new Date(freDate);
                return dt.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return freDate;
            }
        }
        
        async function loadPatientOrders(visitNo) {
            try {
                const today = new Date().toISOString().split('T')[0];
                const res = await fetch(`${API_BASE}/api/v1/patient-orders?visit_date=${today}&visit_no=${visitNo}`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success) {
                    renderOrders(result.data.class_groups);
                } else if (res.status === 401) {
                    location.reload();
                } else {
                    showApiStatus('获取开单信息失败: ' + result.message, 'error');
                }
            } catch (e) {
                console.error('加载开单信息失败:', e);
                showApiStatus('加载开单信息失败', 'error');
            }
        }
        
        function renderOrders(classGroups) {
            const container = document.getElementById('ordersContent');
            
            if (!classGroups || Object.keys(classGroups).length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📋</div><div class="empty-state-text">暂无开单信息</div></div>';
                hideCmcAlert();
                return;
            }
            
            // 检查是否有需要扫码的耗材
            const hasCmcItems = Object.values(classGroups).flat().some(order => order.cmc_flag === '1');
            if (hasCmcItems) {
                showCmcAlert();
            } else {
                hideCmcAlert();
            }
            
            let html = '';
            for (const [className, orders] of Object.entries(classGroups)) {
                html += `
                    <div class="order-group">
                        <div class="order-group-header">
                            <span>${className}</span>
                            <span class="order-group-count">${orders.length}项</span>
                        </div>
                        <table class="order-table">
                            <thead>
                                <tr>
                                    <th>项目编码</th>
                                    <th>项目名称</th>
                                    <th>规格</th>
                                    <th>用法</th>
                                    <th>频次</th>
                                    <th>数量</th>
                                    <th>单价</th>
                                    <th>状态</th>
                                    <th>扫码</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${orders.map(order => `
                                    <tr>
                                        <td>${order.item_code}</td>
                                        <td>${order.item_name}</td>
                                        <td>${order.package_spec || '-'}</td>
                                        <td>${order.administration || '-'}</td>
                                        <td>${order.frequency || '-'}</td>
                                        <td>${order.quantity} ${order.package_units || ''}</td>
                                        <td>¥${order.price}</td>
                                        <td>${order.states || '-'}</td>
                                        <td>
                                            ${order.cmc_flag === '1' 
                                                ? '<span class="cmc-badge">📦 需扫码</span>' 
                                                : '<span style="color: var(--text-tertiary);">-</span>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        function showCmcAlert() {
            document.getElementById('cmcAlert').classList.remove('hidden');
        }
        
        function hideCmcAlert() {
            document.getElementById('cmcAlert').classList.add('hidden');
        }
        
        function refreshOrders() {
            if (currentPatient) {
                loadPatientOrders(currentPatient);
            }
        }
        
        // ============ 工具函数 ============
        function showApiStatus(message, type) {
            const el = document.getElementById('apiStatus');
            el.textContent = message;
            el.className = 'api-status ' + type;
            setTimeout(() => el.style.display = 'none', 5000);
        }
        
        function checkAdminPermission() {
            try {
                const role = nurseInfo.role || '';
                if (role === 'admin' || role === 'head_nurse') {
                    document.getElementById('adminNavItem').style.display = 'flex';
                }
            } catch (error) {
                console.error('检查管理员权限失败:', error);
            }
        }
        
        // 科室筛选事件
        document.getElementById('deptSelect').addEventListener('change', (e) => {
            currentDept = e.target.value;
            filterSchedulesByDept(currentDept);
        });
        
        function filterSchedulesByDept(deptName) {
            renderDoctorList(getVisibleDeptGroups());
        }

        function selectTimeFilter(timeDesc) {
            currentTimeDesc = timeDesc;
            document.querySelectorAll('.time-filter-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.timeDesc === timeDesc);
            });
            renderDoctorList(getVisibleDeptGroups());
        }

        // 根据当前科室和午别筛选生成 renderDoctorList 所需的分组数据。
        // 号别点击后重绘时也使用此函数，避免筛选状态丢失。
        function getVisibleDeptGroups() {
            if (!currentDept && !currentTimeDesc) {
                return deptGroupsData;
            }

            const filtered = schedulesData.filter(schedule =>
                (!currentDept || schedule.dept_name === currentDept) &&
                (!currentTimeDesc || schedule.time_desc === currentTimeDesc)
            );
            const deptGroups = {};
            
            filtered.forEach(schedule => {
                const dept = schedule.dept_name;
                if (!deptGroups[dept]) {
                    deptGroups[dept] = {
                        dept_code: schedule.clinic_dept,
                        dept_name: dept,
                        schedules: []
                    };
                }
                deptGroups[dept].schedules.push(schedule);
            });
            
            return Object.values(deptGroups);
        }
    </script>
</body>
</html>
