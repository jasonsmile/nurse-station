    <script>
        const API_BASE = '';
        let nurseInfo = null;
        let allDeptOptions = [];  // 从 clinic_schedules 加载的科室列表
        
        // 页面加载时获取护士列表
        document.addEventListener('DOMContentLoaded', async function() {
            await checkLogin();
            await loadDeptOptions();
            loadNurses();
        });
        
        // 从 G0013 科室字典接口加载科室下拉选项
        async function loadDeptOptions() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/admin/dept-dict`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success && result.data.departments) {
                    allDeptOptions = result.data.departments.map(d => ({
                        code: d.dept_code,
                        name: d.dept_name
                    }));
                }
                
                // 如果接口失败或返回空，使用备选科室
                if (allDeptOptions.length === 0) {
                    console.warn('G0013科室字典返回空，使用备选科室列表');
                    allDeptOptions = [
                        {code: 'XK', name: '心内科'},
                        {code: 'XWK', name: '心外科'},
                        {code: 'NK', name: '内科'},
                        {code: 'WK', name: '外科'},
                        {code: 'NFMK', name: '内分泌科'},
                        {code: 'ZYK', name: '中医科'}
                    ];
                }
                
                // 填充所有科室下拉框
                populateDeptSelects();
            } catch (e) {
                console.error('加载科室字典失败:', e);
                // 使用备选科室
                allDeptOptions = [
                    {code: 'XK', name: '心内科'},
                    {code: 'XWK', name: '心外科'},
                    {code: 'NK', name: '内科'},
                    {code: 'WK', name: '外科'},
                    {code: 'NFMK', name: '内分泌科'},
                    {code: 'ZYK', name: '中医科'}
                ];
                populateDeptSelects();
            }
        }
        
        // 填充科室下拉框选项
        function populateDeptSelects() {
            const selectIds = ['deptCode', 'deptCode2', 'deptCode3', 'deptCode4', 'deptCode5', 'deptCode6'];
            selectIds.forEach((id, index) => {
                const select = document.getElementById(id);
                const defaultText = index === 0 ? '请选择科室' : '无';
                let html = `<option value="">${defaultText}</option>`;
                allDeptOptions.forEach(dept => {
                    html += `<option value="${dept.code}">${dept.name}</option>`;
                });
                select.innerHTML = html;
            });
            
            // 同时更新筛选下拉框
            const filterDept = document.getElementById('filterDept');
            let filterHtml = '<option value="">全部科室</option>';
            allDeptOptions.forEach(dept => {
                filterHtml += `<option value="${dept.code}">${dept.name}</option>`;
            });
            filterDept.innerHTML = filterHtml;
        }
        
        async function checkLogin() {
            try {
                const res = await fetch(`${API_BASE}/api/v1/auth/current`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success) {
                    nurseInfo = result.data;
                    document.getElementById('currentNurseName').textContent = nurseInfo.name;
                } else {
                    window.location.href = 'index.html';
                }
            } catch (e) {
                console.error('检查登录状态失败:', e);
                window.location.href = 'index.html';
            }
        }
        
        async function doLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            
            try {
                await fetch(`${API_BASE}/api/v1/auth/logout`, { method: 'POST', credentials: 'include' });
            } catch (e) {
                console.error('退出请求失败:', e);
            }
            
            sessionStorage.removeItem('nurseInfo');
            window.location.href = 'index.html';
        }
        
        // 加载护士列表
        async function loadNurses() {
            const keyword = document.getElementById('searchKeyword').value;
            const deptCode = document.getElementById('filterDept').value;
            const status = document.getElementById('filterStatus').value;
            
            try {
                const params = new URLSearchParams();
                if (keyword) params.append('keyword', keyword);
                if (deptCode) params.append('dept_code', deptCode);
                if (status) params.append('status', status);
                
                const response = await fetch(`${API_BASE}/api/v1/admin/nurses?${params}`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderNurseTable(result.data.nurses);
                } else {
                    alert(result.message || '加载失败');
                }
            } catch (error) {
                console.error('加载护士列表失败:', error);
                alert('加载失败，请重试');
            }
        }
        
        // 渲染护士表格
        function renderNurseTable(nurses) {
            const tbody = document.getElementById('nurseTableBody');
            
            if (nurses.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 60px; color: var(--text-tertiary);">
                            暂无数据
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = nurses.map(nurse => `
                <tr>
                    <td>${nurse.nurse_code}</td>
                    <td>${nurse.name}</td>
                    <td>${nurse.title || '-'}</td>
                    <td>
                        <span class="tag tag-blue">${nurse.dept_name}</span>
                        ${nurse.dept_names ? nurse.dept_names.split(',').map(d => 
                            d !== nurse.dept_name ? `<span class="tag tag-green">${d}</span>` : ''
                        ).join('') : ''}
                    </td>
                    <td>
                        ${nurse.role_names ? nurse.role_names.split(',').map(r => 
                            `<span class="tag tag-orange">${r}</span>`
                        ).join('') : '-'}
                    </td>
                    <td>
                        <span class="status-badge ${nurse.status == 1 ? 'status-active' : 'status-inactive'}">
                            ${nurse.status == 1 ? '启用' : '停用'}
                        </span>
                    </td>
                    <td>${nurse.last_login_time ? formatDateTime(nurse.last_login_time) : '从未登录'}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn btn-primary btn-sm" onclick="editNurse('${nurse.nurse_id}')">编辑</button>
                            <button class="btn btn-success btn-sm" onclick="viewPermissions('${nurse.nurse_id}')">权限</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteNurse('${nurse.nurse_id}', '${nurse.name}')">删除</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }
        
        // 显示创建模态框
        function showCreateModal() {
            document.getElementById('modalTitle').textContent = '新增护士';
            document.getElementById('nurseForm').reset();
            document.getElementById('nurseId').value = '';
            document.getElementById('nurseCode').readOnly = false;
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('nurseModal').classList.add('show');
        }
        
        // 编辑护士
        async function editNurse(nurseId) {
            document.getElementById('modalTitle').textContent = '编辑护士';
            document.getElementById('nurseId').value = nurseId;
            document.getElementById('passwordGroup').style.display = 'none';
            
            try {
                const res = await fetch(`${API_BASE}/api/v1/admin/nurses/${nurseId}`, {
                    credentials: 'include'
                });
                const result = await res.json();
                
                if (result.success && result.data.nurse) {
                    const nurse = result.data.nurse;
                    document.getElementById('nurseCode').value = nurse.nurse_code || '';
                    document.getElementById('nurseCode').readOnly = true;
                    document.getElementById('nurseName').value = nurse.name || '';
                    document.getElementById('title').value = nurse.title || '';
                    document.getElementById('floor').value = nurse.floor || '';
                    document.getElementById('phone').value = nurse.phone || '';
                    document.getElementById('email').value = nurse.email || '';
                    
                    // 设置科室下拉框
                    document.getElementById('deptCode').value = nurse.dept_code || '';
                    document.getElementById('deptCode2').value = nurse.dept_code2 || '';
                    document.getElementById('deptCode3').value = nurse.dept_code3 || '';
                    document.getElementById('deptCode4').value = nurse.dept_code4 || '';
                    document.getElementById('deptCode5').value = nurse.dept_code5 || '';
                    document.getElementById('deptCode6').value = nurse.dept_code6 || '';
                    
                    // 设置角色复选框
                    document.querySelectorAll('input[name="roles"]').forEach(cb => cb.checked = false);
                    if (nurse.role_ids) {
                        nurse.role_ids.split(',').forEach(roleId => {
                            const cb = document.querySelector(`input[name="roles"][value="${roleId.trim()}"]`);
                            if (cb) cb.checked = true;
                        });
                    }
                } else {
                    alert(result.message || '加载护士信息失败');
                    return;
                }
            } catch (e) {
                console.error('加载护士详情失败:', e);
                alert('加载护士信息失败');
                return;
            }
            
            document.getElementById('nurseModal').classList.add('show');
        }
        
        // 保存护士
        async function saveNurse() {
            const nurseId = document.getElementById('nurseId').value;
            const nurseCode = document.getElementById('nurseCode').value;
            const nurseName = document.getElementById('nurseName').value;
            const password = document.getElementById('password').value;
            const title = document.getElementById('title').value;
            const deptCode = document.getElementById('deptCode').value;
            const floor = document.getElementById('floor').value;
            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            
            const roleIds = Array.from(document.querySelectorAll('input[name="roles"]:checked'))
                .map(cb => cb.value);
            
            const missingFields = [];
            if (!nurseCode.trim()) missingFields.push('工号');
            if (!nurseName.trim()) missingFields.push('姓名');
            if (!nurseId && !password) missingFields.push('密码');
            if (!deptCode) missingFields.push('主要科室');
            if (roleIds.length === 0) missingFields.push('角色（至少选择一项）');
            if (missingFields.length > 0) {
                alert('请填写必填字段：' + missingFields.join('、'));
                return;
            }
            
            // 获取主科室名称
            const deptSelect = document.getElementById('deptCode');
            const deptName = deptSelect.options[deptSelect.selectedIndex]?.text || deptCode;
            
            const data = {
                nurse_code: nurseCode,
                name: nurseName,
                title: title,
                dept_code: deptCode,
                dept_name: deptName,
                dept_code2: document.getElementById('deptCode2').value || '',
                dept_code3: document.getElementById('deptCode3').value || '',
                dept_code4: document.getElementById('deptCode4').value || '',
                dept_code5: document.getElementById('deptCode5').value || '',
                dept_code6: document.getElementById('deptCode6').value || '',
                floor: floor,
                phone: phone,
                email: email,
                role_ids: roleIds
            };
            
            if (!nurseId && password) {
                data.password = password;
            }
            
            try {
                const url = nurseId ? `${API_BASE}/api/v1/admin/nurses/${nurseId}` : `${API_BASE}/api/v1/admin/nurses`;
                const method = nurseId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(nurseId ? '更新成功' : '创建成功');
                    closeModal();
                    loadNurses();
                } else {
                    alert(result.message || '操作失败');
                }
            } catch (error) {
                console.error('保存护士失败:', error);
                alert('操作失败，请重试');
            }
        }
        
        // 删除护士
        async function deleteNurse(nurseId, nurseName) {
            if (!confirm(`确定要删除护士"${nurseName}"吗？`)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/nurses/${nurseId}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('删除成功');
                    loadNurses();
                } else {
                    alert(result.message || '删除失败');
                }
            } catch (error) {
                console.error('删除护士失败:', error);
                alert('删除失败，请重试');
            }
        }
        
        // 查看权限
        async function viewPermissions(nurseId) {
            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/nurses/${nurseId}/permissions`, {
                    credentials: 'include'
                });
                const result = await response.json();
                
                if (result.success) {
                    renderPermissions(result.data.permissions);
                    document.getElementById('permissionModal').classList.add('show');
                } else {
                    alert(result.message || '加载权限失败');
                }
            } catch (error) {
                console.error('加载权限失败:', error);
                alert('加载权限失败，请重试');
            }
        }
        
        // 渲染权限详情
        function renderPermissions(permissions) {
            const container = document.getElementById('permissionDetail');
            
            if (permissions.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无权限</div>';
                return;
            }
            
            const queryPerms = permissions.filter(p => p.category === 'query');
            const managePerms = permissions.filter(p => p.category === 'manage');
            
            container.innerHTML = `
                ${queryPerms.length > 0 ? `
                    <div class="permission-section">
                        <h3>查询权限</h3>
                        <div class="permission-grid">
                            ${queryPerms.map(p => `
                                <div class="permission-item">
                                    <div class="permission-name">${p.permission_name}</div>
                                    <div class="permission-desc">${p.permission_code}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
                
                ${managePerms.length > 0 ? `
                    <div class="permission-section">
                        <h3>管理权限</h3>
                        <div class="permission-grid">
                            ${managePerms.map(p => `
                                <div class="permission-item">
                                    <div class="permission-name">${p.permission_name}</div>
                                    <div class="permission-desc">${p.permission_code}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : ''}
            `;
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('nurseModal').classList.remove('show');
        }
        
        function closePermissionModal() {
            document.getElementById('permissionModal').classList.remove('show');
        }
        
        // 格式化日期时间
        function formatDateTime(dateTimeStr) {
            if (!dateTimeStr) return '';
            try {
                const dt = new Date(dateTimeStr);
                return dt.toLocaleString('zh-CN');
            } catch (e) {
                return dateTimeStr;
            }
        }
    </script>
</body>
</html>
