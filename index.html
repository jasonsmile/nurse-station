<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CVOnto 护士站 - 智能分诊与医嘱管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; background: #f0f2f5; color: #333; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #1890ff 0%, #36cfc9 100%); color: white; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .header h1 { font-size: 18px; font-weight: 500; }
        .header-info { display: flex; align-items: center; gap: 15px; font-size: 13px; }
        .main-container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 300px; background: white; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; }
        .doctor-filter { padding: 12px; border-bottom: 1px solid #e8e8e8; background: #fafafa; }
        .doctor-filter h3 { font-size: 12px; color: #666; margin-bottom: 8px; }
        .doctor-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
        .doctor-item { display: flex; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; transition: all 0.3s; border: 1px solid transparent; background: white; }
        .doctor-item:hover { border-color: #91d5ff; background: #e6f7ff; }
        .doctor-item.active { border-color: #1890ff; background: #e6f7ff; }
        .doctor-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1890ff, #36cfc9); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; margin-right: 8px; }
        .doctor-info { flex: 1; }
        .doctor-name { font-weight: 500; font-size: 13px; color: #262626; }
        .doctor-title { font-size: 11px; color: #8c8c8c; }
        .doctor-count { background: #ff4d4f; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; min-width: 16px; text-align: center; }
        .sync-btn { margin-top: 8px; padding: 6px 12px; background: #1890ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; width: 100%; }
        .sync-btn:hover { background: #40a9ff; }
        .sync-btn:disabled { background: #d9d9d9; cursor: not-allowed; }
        .status-filter { padding: 12px; border-bottom: 1px solid #e8e8e8; }
        .status-filter h3 { font-size: 12px; color: #666; margin-bottom: 8px; }
        .status-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .status-chip { padding: 5px 10px; border-radius: 12px; font-size: 11px; cursor: pointer; transition: all 0.3s; border: 1px solid #d9d9d9; background: white; color: #595959; }
        .status-chip:hover { border-color: #1890ff; color: #1890ff; }
        .status-chip.active { background: #1890ff; border-color: #1890ff; color: white; }
        .patient-list-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .patient-list-header { padding: 10px 12px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .patient-list-title { font-size: 12px; font-weight: 500; color: #262626; }
        .patient-search { position: relative; }
        .patient-search input { width: 150px; padding: 5px 8px 5px 24px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 11px; }
        .patient-list { flex: 1; overflow-y: auto; padding: 8px; }
        .patient-item { padding: 10px; border-radius: 6px; cursor: pointer; transition: all 0.3s; margin-bottom: 8px; border: 1px solid #e8e8e8; background: white; position: relative; }
        .patient-item:hover { border-color: #91d5ff; box-shadow: 0 2px 6px rgba(24,144,255,0.1); }
        .patient-item.active { border-color: #1890ff; background: #e6f7ff; }
        .patient-item.emergency { border-left: 3px solid #ff4d4f; }
        .patient-item.vip { border-left: 3px solid #faad14; }
        .patient-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .patient-name-section { display: flex; align-items: center; gap: 6px; }
        .patient-name { font-weight: 600; font-size: 14px; color: #262626; }
        .patient-tags { display: flex; gap: 3px; }
        .patient-tag { font-size: 9px; padding: 1px 4px; border-radius: 3px; font-weight: 500; }
        .tag-emergency { background: #fff1f0; color: #f5222d; }
        .tag-vip { background: #fffbe6; color: #faad14; }
        .patient-queue { background: #1890ff; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
        .patient-info-row { display: flex; gap: 10px; font-size: 11px; color: #8c8c8c; margin-bottom: 4px; }
        .patient-doctor { font-size: 11px; color: #595959; margin-bottom: 4px; }
        .patient-doctor span { color: #1890ff; font-weight: 500; }
        .patient-status-bar { display: flex; align-items: center; justify-content: space-between; padding-top: 6px; border-top: 1px dashed #e8e8e8; }
        .status-badge { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .status-dot { width: 5px; height: 5px; border-radius: 50%; }
        .status-not_registered { background: #f5f5f5; color: #8c8c8c; }
        .status-registered_not_arrived { background: #fffbe6; color: #faad14; }
        .status-registered_arrived { background: #f6ffed; color: #52c41a; }
        .status-in_treatment { background: #e6f7ff; color: #1890ff; }
        .status-completed { background: #e6fffb; color: #13c2c2; }
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .stats-bar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 12px; background: white; border-bottom: 1px solid #e8e8e8; }
        .stat-card { background: #fafafa; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; transition: all 0.3s; border: 2px solid transparent; }
        .stat-card:hover { background: #e6f7ff; border-color: #91d5ff; }
        .stat-card.active { background: #e6f7ff; border-color: #1890ff; }
        .stat-number { font-size: 18px; font-weight: 600; margin-bottom: 2px; }
        .stat-label { font-size: 11px; color: #8c8c8c; }
        .stat-total { color: #1890ff; }
        .patient-detail-card { background: white; margin: 12px; padding: 15px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .detail-title { display: flex; align-items: center; gap: 10px; }
        .detail-name { font-size: 20px; font-weight: 600; color: #262626; }
        .detail-tags { display: flex; gap: 6px; }
        .detail-tag { padding: 3px 10px; border-radius: 4px; font-size: 12px; }
        .detail-info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .detail-info-item { display: flex; flex-direction: column; }
        .detail-info-label { font-size: 11px; color: #8c8c8c; margin-bottom: 3px; }
        .detail-info-value { font-size: 13px; color: #262626; font-weight: 500; }
        .tabs-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; margin: 0 12px 12px; background: white; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .tabs-header { display: flex; border-bottom: 1px solid #e8e8e8; padding: 0 15px; }
        .tab-item { padding: 12px 15px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; font-size: 13px; color: #595959; display: flex; align-items: center; gap: 6px; }
        .tab-item:hover { color: #1890ff; }
        .tab-item.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 500; }
        .tab-content { flex: 1; overflow: auto; padding: 15px; }
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: #e8e8e8; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-dot { position: absolute; left: -26px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        .timeline-content { background: #fafafa; padding: 12px; border-radius: 6px; }
        .timeline-title { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
        .timeline-time { font-size: 11px; color: #8c8c8c; }
        .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: #8c8c8c; }
        .empty-state { text-align: center; padding: 40px; color: #8c8c8c; }
        .empty-state-icon { font-size: 48px; margin-bottom: 10px; }
        .api-status { position: fixed; top: 70px; right: 20px; padding: 10px 15px; border-radius: 4px; font-size: 12px; z-index: 1000; transition: all 0.3s; }
        .api-status.success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; }
        .api-status.error { background: #fff1f0; border: 1px solid #ffa39e; color: #f5222d; }
        .api-status.loading { background: #e6f7ff; border: 1px solid #91d5ff; color: #1890ff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏥 CVOnto 护士站 - 智能分诊与医嘱管理系统</h1>
        <div class="header-info">
            <span id="currentTime"></span>
            <span id="apiStatusText">连接中...</span>
        </div>
    </div>
    
    <div class="main-container">
        <aside class="sidebar">
            <div class="doctor-filter">
                <h3>👨‍⚕️ 医生列表</h3>
                <div class="doctor-list" id="doctorList">
                    <div class="loading">加载中...</div>
                </div>
                <button class="sync-btn" id="syncBtn" onclick="syncDoctors()">
                    🔄 从HIS同步医生数据
                </button>
            </div>
            
            <div class="status-filter">
                <h3>📊 就诊状态筛选</h3>
                <div class="status-list" id="statusList">
                    <div class="status-chip active" data-status="">全部</div>
                    <div class="status-chip" data-status="not_registered">未取号</div>
                    <div class="status-chip" data-status="registered_not_arrived">已取号未报到</div>
                    <div class="status-chip" data-status="registered_arrived">已取号已报到</div>
                    <div class="status-chip" data-status="in_treatment">就诊中</div>
                    <div class="status-chip" data-status="completed">已完成</div>
                </div>
            </div>
            
            <div class="patient-list-container">
                <div class="patient-list-header">
                    <span class="patient-list-title">患者列表 (<span id="patientCount">0</span>)</span>
                    <div class="patient-search">
                        <input type="text" id="searchInput" placeholder="搜索患者姓名/卡号" onkeyup="searchPatients()">
                    </div>
                </div>
                <div class="patient-list" id="patientList">
                    <div class="loading">请选择医生或等待数据加载...</div>
                </div>
            </div>
        </aside>
        
        <main class="content">
            <div class="stats-bar" id="statsBar">
                <div class="stat-card active" data-filter="all">
                    <div class="stat-number stat-total" id="statTotal">0</div>
                    <div class="stat-label">全部</div>
                </div>
                <div class="stat-card" data-filter="not_registered">
                    <div class="stat-number" id="statNotReg">0</div>
                    <div class="stat-label">未取号</div>
                </div>
                <div class="stat-card" data-filter="registered">
                    <div class="stat-number" id="statReg">0</div>
                    <div class="stat-label">已取号</div>
                </div>
                <div class="stat-card" data-filter="registered_not_arrived">
                    <div class="stat-number" id="statNotArr">0</div>
                    <div class="stat-label">未报到</div>
                </div>
                <div class="stat-card" data-filter="registered_arrived">
                    <div class="stat-number" id="statArr">0</div>
                    <div class="stat-label">已报到</div>
                </div>
                <div class="stat-card" data-filter="in_treatment">
                    <div class="stat-number" id="statTreat">0</div>
                    <div class="stat-label">就诊中</div>
                </div>
                <div class="stat-card" data-filter="completed">
                    <div class="stat-number" id="statDone">0</div>
                    <div class="stat-label">已完成</div>
                </div>
            </div>
            
            <div class="patient-detail-card" id="patientDetailCard" style="display: none;">
                <div class="detail-header">
                    <div class="detail-title">
                        <span class="detail-name" id="detailName">--</span>
                        <div class="detail-tags" id="detailTags"></div>
                    </div>
                </div>
                <div class="detail-info-grid" id="detailInfoGrid"></div>
            </div>
            
            <div class="tabs-container">
                <div class="tabs-header">
                    <div class="tab-item active" data-tab="timeline">⏱️ 就诊时间线</div>
                </div>
                
                <div class="tab-content" id="timelineTab">
                    <div class="timeline" id="timelineContent">
                        <div class="empty-state">
                            <div class="empty-state-icon">👆</div>
                            <div>请选择左侧患者查看详情</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="api-status" id="apiStatus"></div>
    
    <script>
        // API基础地址 - 根据实际部署修改
        const API_BASE = window.location.origin.includes('localhost') ? 'http://localhost:5000' : '';
        
        // 状态配置
        const STATUS_CONFIG = {
            'not_registered': { name: '未取号', color: '#8c8c8c' },
            'registered_not_arrived': { name: '已取号未报到', color: '#faad14' },
            'registered_arrived': { name: '已取号已报到', color: '#52c41a' },
            'in_treatment': { name: '就诊中', color: '#1890ff' },
            'completed': { name: '已完成', color: '#13c2c2' }
        };
        
        // 全局数据
        let doctorsData = [];
        let patientsData = [];
        let currentDoctor = null;
        let currentStatus = '';
        let currentPatient = null;
        
        // ============ 初始化 ============
        document.addEventListener('DOMContentLoaded', init);
        
        async function init() {
            updateTime();
            setInterval(updateTime, 60000);
            
            // 加载医生数据
            await loadDoctors();
            
            // 设置事件监听
            setupEventListeners();
        }
        
        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN', { 
                year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', weekday: 'long' 
            });
        }
        
        function showApiStatus(message, type) {
            const el = document.getElementById('apiStatus');
            const textEl = document.getElementById('apiStatusText');
            el.textContent = message;
            el.className = 'api-status ' + type;
            textEl.textContent = message;
            setTimeout(() => el.style.display = 'none', 5000);
        }
        
        // ============ 医生数据加载 ============
        async function loadDoctors() {
            try {
                showApiStatus('正在加载医生数据...', 'loading');
                
                const res = await fetch(`${API_BASE}/api/v1/doctors?dept_name=心血管内科`);
                const result = await res.json();
                
                if (result.success && result.data) {
                    doctorsData = result.data.doctors || [];
                    renderDoctorList(doctorsData);
                    showApiStatus(`已加载 ${doctorsData.length} 位医生`, 'success');
                    
                    // 加载患者数据
                    await loadPatients();
                } else {
                    showApiStatus('加载医生数据失败', 'error');
                }
            } catch (e) {
                console.error('加载医生失败:', e);
                showApiStatus('API连接失败，请检查服务是否启动', 'error');
            }
        }
        
        // ============ 同步医生数据 ============
        async function syncDoctors() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.textContent = '🔄 同步中...';
            
            try {
                showApiStatus('正在从HIS同步医生数据...', 'loading');
                
                const res = await fetch(`${API_BASE}/api/v1/doctors/sync`, {
                    method: 'POST'
                });
                const result = await res.json();
                
                if (result.success) {
                    const data = result.data;
                    showApiStatus(`同步成功！新增${data.added}条，更新${data.updated}条`, 'success');
                    
                    // 重新加载医生数据
                    await loadDoctors();
                } else {
                    showApiStatus('同步失败：' + result.message, 'error');
                }
            } catch (e) {
                console.error('同步失败:', e);
                showApiStatus('同步失败，请检查HIS接口配置', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 从HIS同步医生数据';
            }
        }
        
        function renderDoctorList(doctors) {
            const container = document.getElementById('doctorList');
            
            if (doctors.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👨‍⚕️</div><div>暂无医生数据<br>请点击下方按钮同步</div></div>';
                return;
            }
            
            let html = `<div class="doctor-item ${!currentDoctor ? 'active' : ''}" data-doctor-id="">
                <div class="doctor-avatar">全</div>
                <div class="doctor-info">
                    <div class="doctor-name">全部医生</div>
                    <div class="doctor-title">心内科所有医生</div>
                </div>
                <span class="doctor-count" id="countAll">0</span>
            </div>`;
            
            doctors.forEach(doc => {
                const count = patientsData.filter(p => p.doctor_id === doc.doctor_id).length;
                html += `<div class="doctor-item" data-doctor-id="${doc.doctor_id}">
                    <div class="doctor-avatar">${doc.name ? doc.name[0] : '?'}</div>
                    <div class="doctor-info">
                        <div class="doctor-name">${doc.name || '未知'}</div>
                        <div class="doctor-title">${doc.title || ''} · ${doc.dept_name || ''}</div>
                    </div>
                    <span class="doctor-count" id="count${doc.doctor_id}">${count}</span>
                </div>`;
            });
            
            container.innerHTML = html;
            
            // 绑定点击事件
            container.querySelectorAll('.doctor-item').forEach(item => {
                item.addEventListener('click', () => selectDoctor(item.dataset.doctorId));
            });
        }
        
        function selectDoctor(doctorId) {
            currentDoctor = doctorId || null;
            document.querySelectorAll('.doctor-item').forEach(item => {
                item.classList.toggle('active', item.dataset.doctorId === doctorId);
            });
            loadPatients();
        }
        
        // ============ 患者数据加载 ============
        async function loadPatients() {
            try {
                let url = `${API_BASE}/api/v1/patients?dept_name=心内科`;
                if (currentDoctor) url += `&doctor_id=${currentDoctor}`;
                if (currentStatus) url += `&visit_status=${currentStatus}`;
                
                const res = await fetch(url);
                const result = await res.json();
                
                if (result.success && result.data) {
                    patientsData = result.data.patients || [];
                    renderPatientList(patientsData);
                    updateStats(result.data.summary || calculateStats(patientsData));
                    updateDoctorCounts();
                }
            } catch (e) {
                console.error('加载患者失败:', e);
            }
        }
        
        function calculateStats(patients) {
            return {
                total: patients.length,
                not_registered: patients.filter(p => p.visit_status === 'not_registered').length,
                registered: patients.filter(p => p.visit_status && p.visit_status.includes('registered')).length,
                registered_not_arrived: patients.filter(p => p.visit_status === 'registered_not_arrived').length,
                registered_arrived: patients.filter(p => p.visit_status === 'registered_arrived').length,
                in_treatment: patients.filter(p => p.visit_status === 'in_treatment').length,
                completed: patients.filter(p => p.visit_status === 'completed').length
            };
        }
        
        function renderPatientList(patients) {
            const container = document.getElementById('patientList');
            document.getElementById('patientCount').textContent = patients.length;
            
            if (patients.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><div>暂无患者</div></div>';
                return;
            }
            
            container.innerHTML = patients.map(p => {
                const statusCfg = STATUS_CONFIG[p.visit_status] || STATUS_CONFIG['not_registered'];
                const isEmergency = p.is_emergency || p.visit_status === 'emergency';
                const isVip = p.is_vip || p.visit_status === 'vip';
                
                return `<div class="patient-item ${isEmergency ? 'emergency' : ''} ${isVip ? 'vip' : ''} ${currentPatient === p.patient_id ? 'active' : ''}" 
                    data-patient-id="${p.patient_id}" onclick="selectPatient('${p.patient_id}')">
                    <div class="patient-header">
                        <div class="patient-name-section">
                            <span class="patient-name">${p.name || '未知'}</span>
                            <div class="patient-tags">
                                ${isEmergency ? '<span class="patient-tag tag-emergency">急诊</span>' : ''}
                                ${isVip ? '<span class="patient-tag tag-vip">VIP</span>' : ''}
                            </div>
                        </div>
                        <span class="patient-queue">${p.queue_no || '--'}</span>
                    </div>
                    <div class="patient-info-row">
                        <span>${p.gender || '-'}</span>
                        <span>${p.age || '-'}岁</span>
                        <span>序号:${p.visit_sequence || '-'}</span>
                    </div>
                    <div class="patient-doctor">医生：<span>${p.attending_doctor || '-'}</span> · ${p.room || '-'}</div>
                    <div class="patient-status-bar">
                        <span class="status-badge status-${p.visit_status}">
                            <span class="status-dot" style="background: ${statusCfg.color}"></span>
                            ${statusCfg.name}
                        </span>
                        <span class="patient-time">${p.register_time ? formatTime(p.register_time) : ''}</span>
                    </div>
                </div>`;
            }).join('');
        }
        
        function updateStats(summary) {
            document.getElementById('statTotal').textContent = summary.total || 0;
            document.getElementById('statNotReg').textContent = summary.not_registered || 0;
            document.getElementById('statReg').textContent = summary.registered || 0;
            document.getElementById('statNotArr').textContent = summary.registered_not_arrived || 0;
            document.getElementById('statArr').textContent = summary.registered_arrived || 0;
            document.getElementById('statTreat').textContent = summary.in_treatment || 0;
            document.getElementById('statDone').textContent = summary.completed || 0;
        }
        
        function updateDoctorCounts() {
            // 更新全部医生计数
            document.getElementById('countAll').textContent = patientsData.length;
            
            // 更新各医生计数
            doctorsData.forEach(doc => {
                const count = patientsData.filter(p => p.doctor_id === doc.doctor_id).length;
                const countEl = document.getElementById(`count${doc.doctor_id}`);
                if (countEl) countEl.textContent = count;
            });
        }
        
        // ============ 患者详情 ============
        async function selectPatient(patientId) {
            currentPatient = patientId;
            document.querySelectorAll('.patient-item').forEach(item => {
                item.classList.toggle('active', item.dataset.patientId === patientId);
            });
            
            const patient = patientsData.find(p => p.patient_id === patientId);
            if (patient) {
                renderPatientDetail(patient);
                renderTimeline(patient);
            }
        }
        
        function renderPatientDetail(patient) {
            const isEmergency = patient.is_emergency || patient.visit_status === 'emergency';
            const isVip = patient.is_vip || patient.visit_status === 'vip';
            
            document.getElementById('detailName').textContent = patient.name || '未知';
            document.getElementById('detailTags').innerHTML = `
                ${isEmergency ? '<span class="detail-tag" style="background: #fff1f0; color: #f5222d;">急诊</span>' : ''}
                ${isVip ? '<span class="detail-tag" style="background: #fffbe6; color: #faad14;">VIP</span>' : ''}
                <span class="detail-tag" style="background: #e6f7ff; color: #1890ff;">${patient.queue_no || '未取号'}</span>
                <span class="detail-tag" style="background: #f6ffed; color: #52c41a;">${STATUS_CONFIG[patient.visit_status]?.name || '未知'}</span>
            `;
            
            document.getElementById('detailInfoGrid').innerHTML = `
                <div class="detail-info-item">
                    <span class="detail-info-label">就诊卡号</span>
                    <span class="detail-info-value">${patient.card_no || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">就诊序号</span>
                    <span class="detail-info-value">${patient.visit_sequence || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">性别</span>
                    <span class="detail-info-value">${patient.gender || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">年龄</span>
                    <span class="detail-info-value">${patient.age || '-'}岁</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">门诊号</span>
                    <span class="detail-info-value">${patient.patient_no || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">主管医生</span>
                    <span class="detail-info-value">${patient.attending_doctor || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">诊室</span>
                    <span class="detail-info-value">${patient.room || '-'}</span>
                </div>
                <div class="detail-info-item">
                    <span class="detail-info-label">就诊日期</span>
                    <span class="detail-info-value">${patient.admission_date || '-'}</span>
                </div>
                <div class="detail-info-item" style="grid-column: span 4;">
                    <span class="detail-info-label">诊断</span>
                    <span class="detail-info-value">${patient.diagnosis || '-'}</span>
                </div>
            `;
            
            document.getElementById('patientDetailCard').style.display = 'block';
        }
        
        function renderTimeline(patient) {
            const container = document.getElementById('timelineContent');
            const items = [];
            
            if (patient.register_time) items.push({ 
                icon: '📋', color: '#1890ff', title: '患者取号', 
                time: patient.register_time, desc: `排队号：${patient.queue_no || '--'}` 
            });
            if (patient.arrive_time) items.push({ 
                icon: '✅', color: '#52c41a', title: '患者报到', 
                time: patient.arrive_time, desc: '已到诊区等候' 
            });
            if (patient.call_time) items.push({ 
                icon: '👨‍⚕️', color: '#faad14', title: '开始就诊', 
                time: patient.call_time, desc: `医生：${patient.attending_doctor || '--'}` 
            });
            if (patient.complete_time) items.push({ 
                icon: '✔️', color: '#13c2c2', title: '就诊完成', 
                time: patient.complete_time, desc: '诊疗结束' 
            });
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⏱️</div><div>暂无就诊记录</div></div>';
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="timeline-item">
                    <div class="timeline-dot" style="background: ${item.color}; color: white;">${item.icon}</div>
                    <div class="timeline-content">
                        <div class="timeline-title">${item.title}</div>
                        <div class="timeline-time">${formatDateTime(item.time)}</div>
                        <div style="font-size: 12px; color: #8c8c8c; margin-top: 4px;">${item.desc}</div>
                    </div>
                </div>
            `).join('');
        }
        
        // ============ 搜索功能 ============
        function searchPatients() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            if (!keyword) {
                renderPatientList(patientsData);
                return;
            }
            
            const filtered = patientsData.filter(p => 
                (p.name && p.name.toLowerCase().includes(keyword)) ||
                (p.card_no && p.card_no.includes(keyword)) ||
                (p.patient_no && p.patient_no.includes(keyword))
            );
            renderPatientList(filtered);
        }
        
        // ============ 事件监听 ============
        function setupEventListeners() {
            // 状态筛选
            document.querySelectorAll('.status-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    document.querySelectorAll('.status-chip').forEach(c => c.classList.remove('active'));
                    chip.classList.add('active');
                    currentStatus = chip.dataset.status;
                    loadPatients();
                });
            });
            
            // 统计卡片点击
            document.querySelectorAll('.stat-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    const filter = card.dataset.filter;
                    if (filter === 'all') {
                        currentStatus = '';
                    } else if (filter === 'registered') {
                        // 显示已取号的所有状态
                        currentStatus = '';
                    } else {
                        currentStatus = filter;
                    }
                    // 更新状态筛选按钮
                    document.querySelectorAll('.status-chip').forEach(c => {
                        c.classList.toggle('active', c.dataset.status === currentStatus);
                    });
                    loadPatients();
                });
            });
        }
        
        // ============ 工具函数 ============
        function formatTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            return date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        
        function formatDateTime(timeStr) {
            if (!timeStr) return '';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN', { 
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' 
            });
        }
    </script>
</body>
</html>
